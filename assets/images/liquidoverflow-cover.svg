<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500"
     role="img" aria-label="LiquidOverflow: a template render tag escapes the configured LiquidJS root sandbox with directory traversal and reads /etc/passwd, affecting 86,157 downstream repositories.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171d29"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.28"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <ellipse cx="895" cy="300" rx="300" ry="200" fill="url(#glow)"/>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="80" y="112" width="10" height="10" fill="#f97316"/>
    <text x="104" y="122" font-size="20" font-weight="700" letter-spacing="3.5" fill="#fb923c">CVE-2026-30952 &#183; HIGH</text>

    <text x="80" y="220" font-size="66" font-weight="800" letter-spacing="-1" fill="#e6edf3">LIQUID</text>
    <text x="80" y="292" font-size="66" font-weight="800" letter-spacing="-1" fill="#e6edf3">OVERFLOW</text>

    <rect x="80" y="326" width="72" height="4" rx="2" fill="#ef4444"/>

    <text x="80" y="374" font-size="27" font-weight="500" fill="#8b949e">The sandbox that didn&#8217;t hold</text>
    <text x="80" y="412" font-size="21" fill="#6e7a8a" font-family="'JetBrains Mono','Consolas',monospace">LiquidJS &lt; 10.25.0</text>
  </g>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="652" y="112" font-size="16" font-weight="700" letter-spacing="1.8" fill="#2dd4bf">CONFIGURED SANDBOX</text>

    <!-- The boundary the engine was told to respect -->
    <rect x="650" y="124" width="490" height="150" rx="14"
          fill="#2dd4bf" fill-opacity="0.045" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="11 8"/>
    <text x="674" y="162" font-size="19" font-family="'JetBrains Mono','Consolas',monospace" fill="#2dd4bf">root: ['/tmp']</text>

    <rect x="674" y="182" width="442" height="60" rx="10" fill="#131a24" stroke="#ef4444" stroke-width="1.6"/>
    <text x="692" y="219" font-size="17" font-family="'JetBrains Mono','Consolas',monospace" fill="#f87171">{% render '../../../etc/passwd' %}</text>

    <!-- ...and the traversal punching straight through it -->
    <line x1="895" y1="250" x2="895" y2="304" stroke="#ef4444" stroke-width="4" marker-end="url(#ar)"/>

    <rect x="650" y="312" width="490" height="64" rx="12" fill="#0b0f16" stroke="#ef4444" stroke-width="2"/>
    <text x="674" y="352" font-size="21" font-family="'JetBrains Mono','Consolas',monospace" fill="#f87171">/etc/passwd</text>
    <text x="1116" y="352" font-size="16" text-anchor="end" fill="#8b949e">read</text>

    <text x="652" y="408" font-size="18" fill="#7d8797">86,157 repositories downstream</text>
  </g>
</svg>
