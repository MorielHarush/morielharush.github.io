<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500"
     role="img" aria-label="Prototype pollution in protocol-buffers-schema: a trusted .proto schema carrying a __proto__ field option is parsed, which writes onto Object.prototype, and every object in the process inherits the attacker's property.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171d29"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <radialGradient id="redglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <marker id="arrowRed" viewBox="0 0 12 12" refX="9" refY="6"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <ellipse cx="890" cy="300" rx="300" ry="200" fill="url(#redglow)"/>

  <!-- ── Left: title ───────────────────────────────────────────── -->
  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="80" y="112" width="10" height="10" fill="#ef4444"/>
    <text x="104" y="122" font-size="20" font-weight="700" letter-spacing="3.5" fill="#f87171">CVE-2026-5758 &#183; CRITICAL</text>

    <text x="80" y="220" font-size="66" font-weight="800" letter-spacing="-1" fill="#e6edf3">PROTOTYPE</text>
    <text x="80" y="292" font-size="66" font-weight="800" letter-spacing="-1" fill="#e6edf3">POLLUTION</text>

    <rect x="80" y="326" width="72" height="4" rx="2" fill="#ef4444"/>

    <text x="80" y="374" font-size="27" font-weight="500" fill="#8b949e">When your schema poisons the runtime</text>
    <text x="80" y="412" font-size="21" font-weight="400" fill="#6e7a8a" font-family="'JetBrains Mono','Consolas',monospace">protocol-buffers-schema &lt; 3.6.1</text>
  </g>

  <!-- ── Right: the mechanism ──────────────────────────────────── -->
  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">

    <!-- A schema file: trusted container, hostile content -->
    <text x="652" y="100" font-size="16" font-weight="600" letter-spacing="1.6" fill="#2dd4bf">TRUSTED CONFIG &#183; schema.proto</text>

    <rect x="650" y="112" width="490" height="96" rx="12"
          fill="#131a24" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.65"/>
    <text x="672" y="146" font-size="18" font-family="'JetBrains Mono','Consolas',monospace" fill="#6e7a8a">message Exploit {</text>
    <text x="672" y="182" font-size="20" font-family="'JetBrains Mono','Consolas',monospace" fill="#f87171">[(__proto__).polluted = &quot;HACKED&quot;]</text>

    <!-- parse() -->
    <line x1="895" y1="216" x2="895" y2="258" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowRed)"/>
    <text x="912" y="244" font-size="19" font-family="'JetBrains Mono','Consolas',monospace" fill="#8b949e">parse()</text>

    <!-- The prototype gets written -->
    <rect x="650" y="268" width="490" height="76" rx="12"
          fill="#0b0f16" stroke="#ef4444" stroke-width="2"/>
    <text x="672" y="314" font-size="19" font-family="'JetBrains Mono','Consolas',monospace" fill="#f87171">Object.prototype.polluted = &quot;HACKED&quot;</text>

    <!-- Blast radius -->
    <g transform="translate(650,372)">
      <rect x="0" y="0" width="52" height="40" rx="9" fill="#1b2432" stroke="#3d4552"/>
      <text x="26" y="26" font-size="18" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" fill="#8b949e">{}</text>
      <rect x="62" y="0" width="52" height="40" rx="9" fill="#1b2432" stroke="#3d4552"/>
      <text x="88" y="26" font-size="18" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" fill="#8b949e">{}</text>
      <rect x="124" y="0" width="52" height="40" rx="9" fill="#1b2432" stroke="#3d4552"/>
      <text x="150" y="26" font-size="18" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" fill="#8b949e">{}</text>
      <text x="196" y="26" font-size="18" fill="#f87171">&#8592; every object inherits it</text>
    </g>
  </g>
</svg>
