    <text x="80" y="220" font-size="66" font-weight="800" letter-spacing="-1" fill="#e6edf3">SHAI HULUD</text>
    <text x="80" y="292" font-size="66" font-weight="800" letter-spacing="-1" fill="#e6edf3">RETURNS</text>

    <rect x="80" y="326" width="72" height="4" rx="2" fill="#ef4444"/>

    <text x="80" y="374" font-size="27" font-weight="500" fill="#8b949e">It steals your token, then ships itself</text>
    <text x="80" y="412" font-size="21" fill="#6e7a8a" font-family="'JetBrains Mono','Consolas',monospace">keyv / cacheable &#183; 2B downloads / month</text>
  </g>

