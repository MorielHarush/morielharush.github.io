    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.30"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="maw" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#3f0d0d"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <ellipse cx="892" cy="258" rx="285" ry="205" fill="url(#glow)"/>

